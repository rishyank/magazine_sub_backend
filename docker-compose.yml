version: '3.8'services:  mysql-db:    image: mysql:8    container_name: mysql-container    restart: always    environment:      MYSQL_ROOT_PASSWORD: root      MYSQL_DATABASE: magazine_db    ports:      - "3307:3306"    networks:      - springboot-network    volumes:      - mysql-data:/var/lib/mysql    healthcheck:      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]      interval: 15s      timeout: 5s      retries: 20      start_period: 220s  spring-app:    build: .    container_name: springboot-container    depends_on:      mysql-db:        condition: service_healthy    ports:      - "8951:8950"    environment:      SPRING_APPLICATION_NAME: magazine      SERVER_PORT: 8950      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/magazine_db?useSSL=false&allowPublicKeyRetrieval=true      SPRING_DATASOURCE_USERNAME: root      SPRING_DATASOURCE_PASSWORD: root      SPRING_JPA_HIBERNATE_DDL_AUTO: update      SPRING_JPA_SHOW_SQL: "true"      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect      SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT: 60000      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: 30000      SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT: 5000      SECURITY_JWT_SECRET_KEY: K8ruQnpr+et9JAXadx0qmxQV45xqCw+R7sYzcvCReyc=      SECURITY_JWT_EXPIRATION_TIME: 7200000    networks:      - springboot-networknetworks:  springboot-network:    driver: bridgevolumes:  mysql-data: